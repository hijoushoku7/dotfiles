# mise グローバル設定
# docs: https://mise.jdx.dev/configuration.html
#
# 反映:   mise install     (config通りにインストール)
# 更新:   mise upgrade     (下の指定範囲内で最新へ)
# 確認:   mise ls / mise outdated

[tools]
# --- 言語 / ランタイム ---
# メジャー(またはマイナー)で指定 → mise upgrade でパッチ追従できる
node = "26"
go   = "1.26"

# --- CLI ツール ---
eza    = "latest"
gh     = "latest"
tmux   = "latest"
claude = "latest"
codex  = "latest"

# npm は node に同梱されているので通常この行は不要。
# node 同梱版と別の npm を使いたい場合だけ有効化する（同梱版を上書きします）
# npm = "latest"
