# mise グローバル設定
# docs: https://mise.jdx.dev/configuration.html
#
# 反映:   mise install     (config通りにインストール)
# 更新:   mise upgrade     (下の指定範囲内で最新へ)
# 確認:   mise ls / mise outdated

[tools]
# --- 言語 / ランタイム ---
# メジャー(またはマイナー)で指定 → mise upgrade でパッチ追従できる
node = "26"
go   = "1.26"
python = "latest"

# --- CLI ツール ---
eza      = "latest"
gh       = "latest"
lazygit  = "latest"
starship = "latest"
tmux     = "latest"
claude   = "latest"
codex    = "latest"
fzf      = "latest"
ripgrep  = "latest"
neovim   = "nightly"
bat      = "latest"
btop     = "latest"
dust     = "latest"
fd       = "latest"
hunk     = "latest"
